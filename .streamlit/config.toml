[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 5
enableStaticServing = true  # serve a pasta static/ em app/static/ (banner da capa)

[theme]
base = "light"
primaryColor = "#FE0B5D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#000000"
linkColor = "#B3013B"
borderColor = "#FE0B5D"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
font = "Jost:https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap, sans-serif"
headingFont = "Spectral:https://fonts.googleapis.com/css2?family=Spectral:wght@300;400&display=swap, serif"
chartCategoricalColors = ["#FE0B5D", "#1F5FA8", "#B3013B", "#C77700"]
chartSequentialColors = ["#FFE6EE", "#FFC9DA", "#FFA5C0", "#FF7BA3", "#FF4C80", "#FE0B5D", "#D90450", "#B3013B", "#8C0030", "#650022"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
